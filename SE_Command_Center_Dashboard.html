        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0a0f1d',
                        surface: '#111827',
                        surfaceHover: '#1f2937',
                        cyanAccent: '#06b6d4',
                        cyanGlow: 'rgba(6, 182, 212, 0.25)'

    <style>
        body {
            background-color: #0a0f1d;
            color: #f3f4f6;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0f1d;
        }
        ::-webkit-scrollbar-thumb {
            background: #1f2937;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #06b6d4;
        }

        /* Subtle glowing card border */
        .glow-border {
            border: 1px solid rgba(6, 182, 212, 0.3);
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.12);
        }

        /* Live pulse dot animation */
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.15); }
        }
        .animate-pulse-dot {
            animation: pulse-dot 2s infinite ease-in-out;
        }

        /* Responsive 16:9 Aspect Ratio Container */
        .aspect-16-9 {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 aspect ratio */
            height: 0;
            overflow: hidden;
        }
        .aspect-16-9 iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>

<body class="min-h-screen flex flex-col bg-darkbg text-gray-100 antialiased">

    <!-- HEADER TOOLBAR -->
    <header class="bg-surface/90 border-b border-gray-800 px-4 md:px-6 py-3.5 flex flex-wrap items-center justify-between gap-4 sticky top-0 z-30 backdrop-blur-md">
        
        <!-- Left: Title & Live Badge -->
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-600 to-cyan-400 flex items-center justify-center text-darkbg font-extrabold text-lg shadow-lg shadow-cyan-500/20">
                <i class="fa-solid fa-chart-line"></i>
            </div>
            <div>
                <div class="flex items-center gap-2.5">
                    <h1 class="font-extrabold text-sm md:text-base tracking-wider text-cyanAccent uppercase">SE OPERATIONS COMMAND CENTER</h1>
                    <span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 text-[10px] px-2.5 py-0.5 rounded-full font-bold flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse-dot"></span> LIVE
                    </span>
                </div>
                <p id="realtime-clock" class="text-xs text-gray-400 font-mono mt-0.5">Oct 27, 2026 | 13:46:23</p>
            </div>
        </div>

        <!-- Center/Right: Controls (Prev/Next, Reload, Auto Refresh, Export HTML, TV Mode) -->
        <div class="flex items-center space-x-3">
            
            <!-- Prev / Next Navigation Buttons -->
            <div class="flex items-center bg-darkbg border border-gray-700/80 rounded-lg p-1 space-x-1">
                <button onclick="prevFile()" class="p-2 bg-surface hover:bg-surfaceHover text-gray-300 hover:text-cyanAccent rounded-md text-xs transition flex items-center gap-1" title="Previous File">
                    <i class="fa-solid fa-chevron-left"></i>
                    <span class="hidden md:inline">Prev</span>
                </button>
                <span id="page-indicator" class="text-xs text-cyanAccent font-mono px-2">1 / 4</span>
                <button onclick="nextFile()" class="p-2 bg-surface hover:bg-surfaceHover text-gray-300 hover:text-cyanAccent rounded-md text-xs transition flex items-center gap-1" title="Next File">
                    <span class="hidden md:inline">Next</span>
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>

            <!-- Auto-Refresh Selector -->
            <div class="flex items-center bg-darkbg border border-gray-700/80 rounded-lg p-1.5 space-x-2">
                <span class="text-xs text-gray-400 font-medium pl-1 hidden lg:inline">
                    <i class="fa-solid fa-rotate text-cyanAccent mr-1"></i>Auto Refresh:
                </span>
                <select id="auto-refresh-select" onchange="handleRefreshChange(this.value)" class="bg-surface text-cyanAccent text-xs font-semibold rounded px-2 py-1 border border-gray-700 focus:outline-none focus:border-cyanAccent transition cursor-pointer">
                    <option value="off" selected="">Off</option>
                    <option value="1">1m</option>
                    <option value="5">5m</option>
                    <option value="15">15m</option>
                </select>
            </div>

            <!-- Manual Reload Button -->
            <button onclick="reloadViewer()" class="p-2 bg-surface hover:bg-surfaceHover text-gray-300 hover:text-cyanAccent border border-gray-700 rounded-lg text-xs transition flex items-center justify-center" title="Reload Presentation">
                <i id="reload-icon" class="fa-solid fa-arrows-rotate"></i>
            </button>

            <!-- Export HTML Button -->
            <button onclick="exportHTMLFile()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs px-3.5 py-2 rounded-lg flex items-center gap-2 transition shadow-lg shadow-emerald-600/20" title="Export updated HTML file">
                <i class="fa-solid fa-download"></i>
                <span class="hidden sm:inline">Export HTML</span>
            </button>

            <!-- Fullscreen (TV Mode) Toggle -->
            <button onclick="toggleTVMode()" class="bg-gradient-to-r from-cyan-600 to-cyan-500 hover:from-cyan-500 hover:to-cyan-400 text-darkbg font-bold text-xs px-4 py-2 rounded-lg flex items-center gap-2 transition shadow-lg shadow-cyan-500/20">
                <i class="fa-solid fa-tv"></i>
                <span>TV Mode</span>
            </button>

        </div>
    </header>

    <!-- MAIN CONTENT CONTAINER -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 flex flex-col space-y-6">

        <!-- EMBEDDED VIEWER CONTAINER -->
        <section class="bg-surface rounded-2xl glow-border p-2 md:p-3 relative overflow-hidden">
            
            <!-- Loading Indicator Placeholder -->
            <div id="iframe-loader" class="absolute inset-0 bg-surface/90 backdrop-blur-sm z-10 flex flex-col items-center justify-center transition-opacity duration-500 opacity-0 pointer-events-none" style="display: none;">
                <div class="w-10 h-10 border-4 border-gray-800 border-t-cyanAccent rounded-full animate-spin mb-3"></div>
                <p class="text-xs font-semibold text-cyanAccent tracking-wider">Connecting to SharePoint PowerPoint Viewer...</p>
            </div>

            <!-- Responsive 16:9 Frame -->
            <div class="aspect-16-9 rounded-xl overflow-hidden bg-darkbg">
                <iframe id="ppt-iframe" src="https://macoth.sharepoint.com/sites/sedata/_layouts/15/Doc.aspx?sourcedoc={abcc1e8b-6d7a-4a1d-9dee-a469f375283d}&amp;action=embedview&amp;wdAr=1.7793190416141236&amp;wdEaaCheck=1" width="100%" height="100%" frameborder="0" title="PowerPoint Viewer" allowfullscreen="true" onload="onIframeLoaded()">
                </iframe>
            </div>
        </section>

        <!-- EMBED LINKS MANAGER SECTION -->
        <section class="bg-surface border border-gray-800 rounded-2xl p-4 md:p-5 space-y-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-code text-cyanAccent text-sm"></i>
                    <h2 class="font-extrabold text-xs md:text-sm uppercase tracking-wider text-gray-200">
                        SE Command Center - Embed File Manager
                    </h2>
                </div>
                <div class="flex items-center gap-3">
                    <span id="save-status" class="text-[11px] text-gray-500 font-mono transition-opacity opacity-0">Saved</span>
                    <button onclick="addFileRow()" class="bg-darkbg hover:bg-surfaceHover text-cyanAccent border border-cyan-500/40 font-semibold text-xs px-3 py-1.5 rounded-lg transition flex items-center gap-1.5">
                        <i class="fa-solid fa-plus text-emerald-400"></i>
                        <span>Add Embed Link</span>
                    </button>
                </div>
            </div>

            <!-- Dynamic File List Container -->
            <div id="file-list-container" class="space-y-2.5 max-h-60 overflow-y-auto pr-1"><div class="flex items-center gap-2 bg-darkbg border border-gray-800 rounded-xl p-2 transition focus-within:border-cyanAccent border-cyanAccent/80 shadow-lg shadow-cyan-500/10">
                    <span class="file-number text-gray-500 text-xs font-mono pl-1 shrink-0">#1</span>
                    <input type="text" class="file-name-input bg-transparent text-gray-300 text-xs font-medium focus:outline-none w-1/3 md:w-1/4 border-r border-gray-800 pr-2" placeholder="Dashboard / File Name" value="Main Dashboard Presentation" oninput="triggerAutoSave()">
                    <input type="text" class="file-url-input bg-transparent text-gray-200 text-xs font-mono focus:outline-none flex-1 px-1" placeholder="Paste SharePoint Embed URL here..." value="https://macoth.sharepoint.com/sites/sedata/_layouts/15/Doc.aspx?sourcedoc={abcc1e8b-6d7a-4a1d-9dee-a469f375283d}&amp;action=embedview&amp;wdAr=1.7793190416141236&amp;wdEaaCheck=1" oninput="triggerAutoSave()">
                    
                    <button onclick="selectAndDisplay(0)" class="view-btn px-3 py-1 bg-cyan-600/20 hover:bg-cyan-600/40 text-cyanAccent border border-cyan-500/40 rounded-lg text-xs font-semibold transition shrink-0 flex items-center gap-1.5" title="Display on Screen">
                        <i class="fa-solid fa-desktop"></i>
                        <span>View</span>
                    </button>

                    <button onclick="removeFileRow(this)" class="p-1.5 text-red-400/70 hover:text-red-400 transition shrink-0" title="Delete Row">
                        <i class="fa-solid fa-trash-can text-xs"></i>
                    </button>
                </div><div class="flex items-center gap-2 bg-darkbg border border-gray-800 rounded-xl p-2 transition focus-within:border-cyanAccent">
                    <span class="file-number text-gray-500 text-xs font-mono pl-1 shrink-0">#2</span>
                    <input type="text" class="file-name-input bg-transparent text-gray-300 text-xs font-medium focus:outline-none w-1/3 md:w-1/4 border-r border-gray-800 pr-2" placeholder="Dashboard / File Name" value="2" oninput="triggerAutoSave()">
                    <input type="text" class="file-url-input bg-transparent text-gray-200 text-xs font-mono focus:outline-none flex-1 px-1" placeholder="Paste SharePoint Embed URL here..." value="https://macoth.sharepoint.com/sites/sedata/_layouts/15/Doc.aspx?sourcedoc={abcc1e8b-6d7a-4a1d-9dee-a469f375283d}&amp;action=embedview&amp;wdAr=1.7793190416141236&amp;wdEaaCheck=1" oninput="triggerAutoSave()">
                    
                    <button onclick="selectAndDisplay(1)" class="view-btn px-3 py-1 bg-cyan-600/20 hover:bg-cyan-600/40 text-cyanAccent border border-cyan-500/40 rounded-lg text-xs font-semibold transition shrink-0 flex items-center gap-1.5" title="Display on Screen">
                        <i class="fa-solid fa-desktop"></i>
                        <span>View</span>
                    </button>

                    <button onclick="removeFileRow(this)" class="p-1.5 text-red-400/70 hover:text-red-400 transition shrink-0" title="Delete Row">
                        <i class="fa-solid fa-trash-can text-xs"></i>
                    </button>
                </div></div>
        </section>

    </main>

    <!-- FOOTER -->
    <footer class="bg-surface/50 border-t border-gray-800/80 px-6 py-2.5 text-center text-[11px] text-gray-500">
        SE Operations Command Center • Internal Viewer Platform
    </footer>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        let autoRefreshTimer = null;
        let saveDebounceTimer = null;
        let currentActiveIndex = 0;

        // Real-Time Clock
        function updateClock() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('en-US', { hour12: false });
            const dateStr = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            document.getElementById('realtime-clock').innerText = `${dateStr} | ${timeStr}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        function onIframeLoaded() {
            const loader = document.getElementById('iframe-loader');
            loader.classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                loader.style.display = 'none';
            }, 500);
        }

        function reloadViewer() {
            const loader = document.getElementById('iframe-loader');
            const iframe = document.getElementById('ppt-iframe');
            const icon = document.getElementById('reload-icon');

            loader.style.display = 'flex';
            loader.classList.remove('opacity-0', 'pointer-events-none');
            
            icon.classList.add('animate-spin');
            setTimeout(() => icon.classList.remove('animate-spin'), 1000);

            const currentSrc = iframe.src;
            iframe.src = currentSrc;
        }

        const FILES_KEY = 'se_command_center_embed_list';
        const ACTIVE_INDEX_KEY = 'se_command_center_active_index';

        function loadFiles() {
            const savedData = localStorage.getItem(FILES_KEY);
            const savedIndex = localStorage.getItem(ACTIVE_INDEX_KEY);
            let fileList = [];

            if (savedData !== null) {
                try {
                    fileList = JSON.parse(savedData);
                } catch(e) {
                    fileList = [];
                }
            }

            if (fileList.length === 0) {
                fileList = [
    {
        "name": "Main Dashboard Presentation",
        "url": "https://macoth.sharepoint.com/sites/sedata/_layouts/15/Doc.aspx?sourcedoc={abcc1e8b-6d7a-4a1d-9dee-a469f375283d}&action=embedview&wdAr=1.7793190416141236&wdEaaCheck=1"
    },
    {
        "name": "2",
        "url": "https://macoth.sharepoint.com/sites/sedata/_layouts/15/Doc.aspx?sourcedoc={abcc1e8b-6d7a-4a1d-9dee-a469f375283d}&action=embedview&wdAr=1.7793190416141236&wdEaaCheck=1"
    }
];
            }

            renderFileList(fileList);

            if (savedIndex !== null) {
                currentActiveIndex = parseInt(savedIndex, 10) || 0;
            }

            const totalRows = document.querySelectorAll('#file-list-container .flex').length;
            if (currentActiveIndex >= totalRows) {
                currentActiveIndex = totalRows - 1;
            }
            if (currentActiveIndex < 0) {
                currentActiveIndex = 0;
            }

            selectAndDisplay(currentActiveIndex);
        }

        function renderFileList(fileList) {
            const container = document.getElementById('file-list-container');
            container.innerHTML = '';

            fileList.forEach((file, index) => {
                const row = document.createElement('div');
                row.className = `flex items-center gap-2 bg-darkbg border border-gray-800 rounded-xl p-2 transition focus-within:border-cyanAccent`;
                row.innerHTML = `
                    <span class="file-number text-gray-500 text-xs font-mono pl-1 shrink-0">#${index + 1}</span>
                    <input type="text" 
                           class="file-name-input bg-transparent text-gray-300 text-xs font-medium focus:outline-none w-1/3 md:w-1/4 border-r border-gray-800 pr-2" 
                           placeholder="Dashboard / File Name" 
                           value="${escapeHtml(file.name)}" 
                           oninput="triggerAutoSave()">
                    <input type="text" 
                           class="file-url-input bg-transparent text-gray-200 text-xs font-mono focus:outline-none flex-1 px-1" 
                           placeholder="Paste SharePoint Embed URL here..." 
                           value="${escapeHtml(file.url)}" 
                           oninput="triggerAutoSave()">
                    
                    <button onclick="selectAndDisplay(${index})" class="view-btn px-3 py-1 bg-cyan-600/20 hover:bg-cyan-600/40 text-cyanAccent border border-cyan-500/40 rounded-lg text-xs font-semibold transition shrink-0 flex items-center gap-1.5" title="Display on Screen">
                        <i class="fa-solid fa-desktop"></i>
                        <span>View</span>
                    </button>

                    <button onclick="removeFileRow(this)" class="p-1.5 text-red-400/70 hover:text-red-400 transition shrink-0" title="Delete Row">
                        <i class="fa-solid fa-trash-can text-xs"></i>
                    </button>
                `;
                container.appendChild(row);
            });
            refreshRowNumbers();
        }

        function refreshRowNumbers() {
            const container = document.getElementById('file-list-container');
            const rows = container.querySelectorAll('.flex');
            rows.forEach((row, idx) => {
                row.querySelector('.file-number').innerText = `#${idx + 1}`;
                row.querySelector('.view-btn').setAttribute('onclick', `selectAndDisplay(${idx})`);
            });
            updatePageIndicator();
        }

        function updatePageIndicator() {
            const rows = document.querySelectorAll('#file-list-container .flex');
            const totalCount = rows.length;
            const indicator = document.getElementById('page-indicator');
            
            if (totalCount === 0) {
                indicator.innerText = `0 / 0`;
                currentActiveIndex = 0;
            } else {
                if (currentActiveIndex >= totalCount) {
                    currentActiveIndex = totalCount - 1;
                }
                indicator.innerText = `${currentActiveIndex + 1} / ${totalCount}`;
            }
        }

        function selectAndDisplay(index) {
            const rows = document.querySelectorAll('#file-list-container .flex');
            
            if (rows.length === 0) {
                updatePageIndicator();
                return;
            }
            if (index < 0) index = rows.length - 1;
            if (index >= rows.length) index = 0;

            currentActiveIndex = index;
            localStorage.setItem(ACTIVE_INDEX_KEY, currentActiveIndex);
            
            rows.forEach((r, idx) => {
                if (idx === index) {
                    r.classList.add('border-cyanAccent/80', 'shadow-lg', 'shadow-cyan-500/10');
                } else {
                    r.classList.remove('border-cyanAccent/80', 'shadow-lg', 'shadow-cyan-500/10');
                }
            });

            displayEmbed(index);
            updatePageIndicator();
        }

        function displayEmbed(index) {
            const rows = document.querySelectorAll('#file-list-container .flex');
            if (!rows[index]) return;

            const url = rows[index].querySelector('.file-url-input').value.trim();
            const iframe = document.getElementById('ppt-iframe');
            const loader = document.getElementById('iframe-loader');

            loader.style.display = 'flex';
            loader.classList.remove('opacity-0', 'pointer-events-none');

            if (url) {
                iframe.src = url;
            } else {
                iframe.src = 'about:blank';
                setTimeout(onIframeLoaded, 300);
            }
        }

        function nextFile() {
            const rows = document.querySelectorAll('#file-list-container .flex');
            if (rows.length === 0) return;

            const nextIndex = (currentActiveIndex + 1) % rows.length;
            selectAndDisplay(nextIndex);
        }

        function prevFile() {
            const rows = document.querySelectorAll('#file-list-container .flex');
            if (rows.length === 0) return;

            const prevIndex = (currentActiveIndex - 1 + rows.length) % rows.length;
            selectAndDisplay(prevIndex);
        }

        function addFileRow() {
            const container = document.getElementById('file-list-container');
            const rows = container.querySelectorAll('.flex');
            const newIndex = rows.length;
            
            const row = document.createElement('div');
            row.className = 'flex items-center gap-2 bg-darkbg border border-gray-800 rounded-xl p-2 transition focus-within:border-cyanAccent';
            row.innerHTML = `
                <span class="file-number text-gray-500 text-xs font-mono pl-1 shrink-0">#${newIndex + 1}</span>
                <input type="text" 
                       class="file-name-input bg-transparent text-gray-300 text-xs font-medium focus:outline-none w-1/3 md:w-1/4 border-r border-gray-800 pr-2" 
                       placeholder="Dashboard / File Name" 
                       oninput="triggerAutoSave()">
                <input type="text" 
                       class="file-url-input bg-transparent text-gray-200 text-xs font-mono focus:outline-none flex-1 px-1" 
                       placeholder="Paste SharePoint Embed URL here..." 
                       oninput="triggerAutoSave()">
                <button onclick="selectAndDisplay(${newIndex})" class="view-btn px-3 py-1 bg-cyan-600/20 hover:bg-cyan-600/40 text-cyanAccent border border-cyan-500/40 rounded-lg text-xs font-semibold transition shrink-0 flex items-center gap-1.5" title="Display on Screen">
                    <i class="fa-solid fa-desktop"></i>
                    <span>View</span>
                </button>
                <button onclick="removeFileRow(this)" class="p-1.5 text-red-400/70 hover:text-red-400 transition shrink-0" title="Delete Row">
                    <i class="fa-solid fa-trash-can text-xs"></i>
                </button>
            `;
            container.appendChild(row);
            refreshRowNumbers();
            triggerAutoSave();
        }

        function removeFileRow(btn) {
            const row = btn.closest('.flex');
            const container = document.getElementById('file-list-container');
            const rowsArray = Array.from(container.querySelectorAll('.flex'));
            const removedIndex = rowsArray.indexOf(row);
            
            row.remove();
            refreshRowNumbers();

            const remainingRows = container.querySelectorAll('.flex');
            if (remainingRows.length > 0) {
                if (currentActiveIndex >= remainingRows.length) {
                    selectAndDisplay(remainingRows.length - 1);
                } else if (removedIndex === currentActiveIndex) {
                    selectAndDisplay(Math.min(removedIndex, remainingRows.length - 1));
                } else {
                    selectAndDisplay(currentActiveIndex);
                }
            } else {
                currentActiveIndex = 0;
                document.getElementById('ppt-iframe').src = 'about:blank';
                setTimeout(onIframeLoaded, 300);
                saveFilesToStorage();
                updatePageIndicator();
            }
        }

        function triggerAutoSave() {
            showSaveStatus('Typing...');
            clearTimeout(saveDebounceTimer);
            saveDebounceTimer = setTimeout(() => {
                saveFilesToStorage();
            }, 800);
        }

        function saveFilesToStorage() {
            const container = document.getElementById('file-list-container');
            const rows = container.querySelectorAll('.flex');
            let fileList = [];

            rows.forEach(row => {
                const inputs = row.querySelectorAll('input');
                if (inputs.length >= 2) {
                    fileList.push({
                        name: inputs[0].value,
                        url: inputs[1].value
                    });
                }
            });

            localStorage.setItem(FILES_KEY, JSON.stringify(fileList));
            localStorage.setItem(ACTIVE_INDEX_KEY, currentActiveIndex);
            showSaveStatus('Saved');
        }

        // ฟังก์ชัน Export HTML: ดึงข้อมูลปัจจุบันฝังลงไฟล์ HTML ใหม่และสั่งดาวน์โหลดลงเครื่องทันที
        function exportHTMLFile() {
            const rows = document.querySelectorAll('#file-list-container .flex');
            let currentList = [];
            rows.forEach(row => {
                const inputs = row.querySelectorAll('input');
                if (inputs.length >= 2) {
                    currentList.push({
                        name: inputs[0].value,
                        url: inputs[1].value
                    });
                }
            });

            let fullHtml = document.documentElement.outerHTML;
            const updatedDefaultArray = JSON.stringify(currentList, null, 4);

            // แทนที่ค่าเริ่มต้นในฟังก์ชัน loadFiles() สำหรับไฟล์ที่ดาวน์โหลดไปใหม่
            fullHtml = fullHtml.replace(/fileList = \[\s*\{[\s\S]*?\}\s*\];/g, `fileList = ${updatedDefaultArray};`);

            const blob = new Blob([fullHtml], { type: 'text/html' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'SE_Command_Center_Dashboard.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(a.href);

            showSaveStatus('Exported HTML!');
        }

        function showSaveStatus(msg) {
            const statusEl = document.getElementById('save-status');
            statusEl.innerText = msg;
            statusEl.classList.remove('opacity-0');
            setTimeout(() => {
                statusEl.classList.add('opacity-0');
            }, 2500);
        }

        function handleRefreshChange(value) {
            if (autoRefreshTimer) {
                clearInterval(autoRefreshTimer);
                autoRefreshTimer = null;
            }

            if (value !== 'off') {
                const minutes = parseInt(value, 10);
                autoRefreshTimer = setInterval(() => {
                    reloadViewer();
                }, minutes * 60 * 1000);
            }
        }

        function toggleTVMode() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`Error attempting to enable fullscreen mode: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;")
                      .replace(/</g, "&lt;")
                      .replace(/>/g, "&gt;")
                      .replace(/"/g, "&quot;")
                      .replace(/'/g, "&#039;");
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadFiles();
        });
    </script>

</body></html>
