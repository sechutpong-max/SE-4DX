<body class="min-h-screen flex flex-col bg-darkbg text-gray-100 antialiased">

    <!-- HEADER TOOLBAR -->
    <header class="bg-surface/90 border-b border-gray-800 px-4 md:px-6 py-3.5 flex flex-wrap items-center justify-between gap-4 sticky top-0 z-30 backdrop-blur-md">
        <div class="flex items-center space-x-3">
            <button onclick="toggleSidebar()" class="p-2 bg-surface hover:bg-surfaceHover border border-gray-700 text-cyanAccent rounded-xl transition" title="Toggle Sidebar Link Manager">
                <i class="fa-solid fa-bars text-base"></i>
            </button>
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-600 to-cyan-400 flex items-center justify-center text-darkbg font-extrabold text-lg shadow-lg shadow-cyan-500/20">
                <i class="fa-solid fa-chart-line"></i>
            </div>
            <div>
                <div class="flex items-center gap-2.5">
                    <h1 class="font-extrabold text-sm md:text-base tracking-wider text-cyanAccent uppercase">SE OPERATIONS COMMAND CENTER</h1>
                    <span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 text-[10px] px-2.5 py-0.5 rounded-full font-bold flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse-dot"></span> LIVE
                    </span>
                </div>
                <p id="realtime-clock" class="text-xs text-gray-400 font-mono mt-0.5">Nov 3, 2026 | 09:00:19</p>
            </div>
        </div>

        <div class="flex items-center space-x-3">
            <div class="flex items-center bg-darkbg border border-gray-700/80 rounded-lg p-1 space-x-1">
                <button onclick="prevFile()" class="p-2 bg-surface hover:bg-surfaceHover text-gray-300 hover:text-cyanAccent rounded-md text-xs transition flex items-center gap-1" title="Previous File"><i class="fa-solid fa-chevron-left"></i><span class="hidden md:inline">Prev</span></button>
                <span id="page-indicator" class="text-xs text-cyanAccent font-mono px-2">1 / 3</span>
                <button onclick="nextFile()" class="p-2 bg-surface hover:bg-surfaceHover text-gray-300 hover:text-cyanAccent rounded-md text-xs transition flex items-center gap-1" title="Next File"><span class="hidden md:inline">Next</span><i class="fa-solid fa-chevron-right"></i></button>
            </div>

            <div class="flex items-center bg-darkbg border border-gray-700/80 rounded-lg p-1.5 space-x-2">
                <span class="text-xs text-gray-400 font-medium pl-1 hidden lg:inline"><i class="fa-solid fa-rotate text-cyanAccent mr-1"></i>Auto Refresh:</span>
                <select id="auto-refresh-select" onchange="handleRefreshChange(this.value)" class="bg-surface text-cyanAccent text-xs font-semibold rounded px-2 py-1 border border-gray-700 focus:outline-none focus:border-cyanAccent transition cursor-pointer">
                    <option value="off" selected="">Off</option>
                    <option value="1">1m</option>
                    <option value="5">5m</option>
                    <option value="15">15m</option>
                </select>
            </div>

            <button onclick="reloadViewer()" class="p-2 bg-surface hover:bg-surfaceHover text-gray-300 hover:text-cyanAccent border border-gray-700 rounded-lg text-xs transition flex items-center justify-center" title="Reload Presentation"><i id="reload-icon" class="fa-solid fa-arrows-rotate"></i></button>
            <button onclick="exportHTMLFile()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs px-3.5 py-2 rounded-lg flex items-center gap-2 transition shadow-lg shadow-emerald-600/20" title="Export updated HTML file"><i class="fa-solid fa-download"></i><span class="hidden sm:inline">Export HTML</span></button>
            <button onclick="toggleTVMode()" class="bg-gradient-to-r from-cyan-600 to-cyan-500 hover:from-cyan-500 hover:to-cyan-400 text-darkbg font-bold text-xs px-4 py-2 rounded-lg flex items-center gap-2 transition shadow-lg shadow-cyan-500/20"><i class="fa-solid fa-tv"></i><span>TV Mode</span></button>
        </div>
    </header>

    <!-- MAIN WRAPPER WITH SIDEBAR -->
    <div class="flex-1 flex overflow-hidden">
        <aside id="sidebar-manager" class="w-80 md:w-96 bg-surface border-r border-gray-800 p-4 flex flex-col space-y-4 shrink-0 transition-all duration-300">
            <div class="flex items-center justify-between pb-2 border-b border-gray-800">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-cyanAccent text-sm"></i>

                <div class="flex items-center justify-between gap-1">
                    <span class="file-number text-cyanAccent font-extrabold text-xs font-mono">#2</span>
                    <select class="file-type-select bg-surface text-gray-300 text-[11px] font-semibold rounded px-1.5 py-0.5 border border-gray-700 focus:outline-none" onchange="triggerAutoSave()">
                        <option value="embed" selected="">Embed View</option>

                        <a href="https://macoth.sharepoint.com/sites/sedata/_layouts/15/Doc.aspx?sourcedoc={cb65200d-5362-4a01-9ea5-91a40e3e36ae}&amp;action=embedview&amp;wdAr=1.3333333333333333" target="_blank" class="ext-btn px-1.5 py-0.5 bg-surface hover:bg-surfaceHover text-gray-400 hover:text-white border border-gray-700 rounded text-[11px]" title="Open Tab"><i class="fa-solid fa-arrow-up-right-from-square"></i></a>
                        <button onclick="removeFileRow(this)" class="p-1 text-red-400/70 hover:text-red-400 transition" title="Delete"><i class="fa-solid fa-trash-can text-xs"></i></button>
                    </div>
                </div>
                <input type="text" class="file-name-input bg-surface text-gray-200 text-xs font-medium px-2 py-1 rounded border border-gray-800 focus:outline-none focus:border-cyanAccent" placeholder="Dashboard / File Name" oninput="triggerAutoSave()">
                <input type="text" class="file-url-input bg-surface text-gray-300 text-[11px] font-mono px-2 py-1 rounded border border-gray-800 focus:outline-none focus:border-cyanAccent" placeholder="Paste URL or Embed Link here..." oninput="triggerAutoSave()">
            </div><div class="file-row flex flex-col gap-1.5 bg-darkbg border border-gray-800 rounded-xl p-2.5 transition focus-within:border-cyanAccent">

                        <a href="https://macoth.sharepoint.com/sites/sedata/_layouts/15/Doc.aspx?sourcedoc={8a98134d-06db-4249-877b-382eb3ab98ed}&amp;action=embedview&amp;wdAr=1.4444444444444444" target="_blank" class="ext-btn px-1.5 py-0.5 bg-surface hover:bg-surfaceHover text-gray-400 hover:text-white border border-gray-700 rounded text-[11px]" title="Open Tab"><i class="fa-solid fa-arrow-up-right-from-square"></i></a>

                    <span id="active-dashboard-title" class="font-bold text-xs md:text-sm text-gray-200">Main Dashboard Presentation</span>
                </div>
                <a id="external-open-btn" href="https://macoth.sharepoint.com/sites/sedata/_layouts/15/Doc.aspx?sourcedoc={abcc1e8b-6d7a-4a1d-9dee-a469f375283d}&amp;action=embedview&amp;wdAr=1.7793190416141236&amp;wdEaaCheck=1" target="_blank" class="text-xs text-cyanAccent hover:underline flex items-center gap-1 font-mono">
                    <span>Open Link in New Tab</span>
                    <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                </a>
            </div>

            <section class="bg-surface rounded-2xl glow-border p-2 md:p-3 relative flex-1 flex flex-col">
                <div id="iframe-loader" class="absolute inset-0 bg-surface/90 backdrop-blur-sm z-10 flex flex-col items-center justify-center transition-opacity duration-500 opacity-0 pointer-events-none" style="display: none;">
                    <div class="w-10 h-10 border-4 border-gray-800 border-t-cyanAccent rounded-full animate-spin mb-3"></div>
                    <p class="text-xs font-semibold text-cyanAccent tracking-wider">Loading Requested Dashboard / Link...</p>
                </div>
                <div class="aspect-16-9 rounded-xl overflow-hidden bg-darkbg flex-1">
                    <iframe id="ppt-iframe" src="https://macoth.sharepoint.com/sites/sedata/_layouts/15/Doc.aspx?sourcedoc={abcc1e8b-6d7a-4a1d-9dee-a469f375283d}&amp;action=embedview&amp;wdAr=1.7793190416141236&amp;wdEaaCheck=1" width="100%" height="100%" frameborder="0" title="Dashboard Viewer" allowfullscreen="true" onload="onIframeLoaded()"></iframe>

    <!-- FOOTER -->
    <footer class="bg-surface/50 border-t border-gray-800/80 px-6 py-2 text-center text-[11px] text-gray-500">
        SE Operations Command Center • Internal Viewer Platform
    </footer>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        let autoRefreshTimer = null, saveDebounceTimer = null, currentActiveIndex = 0;
        const FILES_KEY = 'se_command_center_embed_list_v2', ACTIVE_INDEX_KEY = 'se_command_center_active_index_v2';

        function updateClock() {
            const now = new Date();
            document.getElementById('realtime-clock').innerText = `${now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })} | ${now.toLocaleTimeString('en-US', { hour12: false })}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        function toggleSidebar() { document.getElementById('sidebar-manager').classList.toggle('hidden'); }

        function onIframeLoaded() {
            const loader = document.getElementById('iframe-loader');
            loader.classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => loader.style.display = 'none', 500);
        }

        function reloadViewer() {
            const loader = document.getElementById('iframe-loader'), iframe = document.getElementById('ppt-iframe'), icon = document.getElementById('reload-icon');
            loader.style.display = 'flex';
            loader.classList.remove('opacity-0', 'pointer-events-none');
            icon.classList.add('animate-spin');
            setTimeout(() => icon.classList.remove('animate-spin'), 1000);
            iframe.src = iframe.src;
        }

        function loadFiles() {
            const savedData = localStorage.getItem(FILES_KEY), savedIndex = localStorage.getItem(ACTIVE_INDEX_KEY);
            let fileList = [];
            if (savedData !== null) { try { fileList = JSON.parse(savedData); } catch(e) { fileList = []; } }

            if (fileList.length === 0) {
                fileList = [
    {
        "name": "Main Dashboard Presentation",
        "url": "https://macoth.sharepoint.com/sites/sedata/_layouts/15/Doc.aspx?sourcedoc={abcc1e8b-6d7a-4a1d-9dee-a469f375283d}&action=embedview&wdAr=1.7793190416141236&wdEaaCheck=1",
        "type": "embed"
    },
    {
        "name": "RAC&PAC Quality improvement",
        "url": "https://macoth.sharepoint.com/sites/sedata/_layouts/15/Doc.aspx?sourcedoc={cb65200d-5362-4a01-9ea5-91a40e3e36ae}&action=embedview&wdAr=1.3333333333333333",
        "type": "embed"
    },
    {
        "name": "KX Quality improvement",
        "url": "https://macoth.sharepoint.com/sites/sedata/_layouts/15/Doc.aspx?sourcedoc={8a98134d-06db-4249-877b-382eb3ab98ed}&action=embedview&wdAr=1.4444444444444444",
        "type": "embed"
    }
];
            }

            renderFileList(fileList);
            if (savedIndex !== null) currentActiveIndex = parseInt(savedIndex, 10) || 0;
            const totalRows = document.querySelectorAll('#file-list-container .file-row').length;
            if (currentActiveIndex >= totalRows) currentActiveIndex = totalRows - 1;
            if (currentActiveIndex < 0) currentActiveIndex = 0;
            selectAndDisplay(currentActiveIndex);
        }

        function renderFileList(fileList) {
            const container = document.getElementById('file-list-container');
            container.innerHTML = '';
            fileList.forEach((file, index) => {
                const row = document.createElement('div');
                row.className = `file-row flex flex-col gap-1.5 bg-darkbg border border-gray-800 rounded-xl p-2.5 transition focus-within:border-cyanAccent`;
                row.innerHTML = `
                    <div class="flex items-center justify-between gap-1">
                        <span class="file-number text-cyanAccent font-extrabold text-xs font-mono">#${index + 1}</span>
                        <select class="file-type-select bg-surface text-gray-300 text-[11px] font-semibold rounded px-1.5 py-0.5 border border-gray-700 focus:outline-none" onchange="triggerAutoSave()">
                            <option value="embed" ${file.type === 'embed' ? 'selected' : ''}>Embed View</option>
                            <option value="external" ${file.type === 'external' ? 'selected' : ''}>External Link</option>
                        </select>
                        <div class="flex items-center gap-1">
                            <button onclick="selectAndDisplay(${index})" class="view-btn px-2 py-0.5 bg-cyan-600/20 hover:bg-cyan-600/40 text-cyanAccent border border-cyan-500/40 rounded text-[11px] font-semibold transition" title="Display">View</button>
                            <a href="${escapeHtml(file.url)}" target="_blank" class="ext-btn px-1.5 py-0.5 bg-surface hover:bg-surfaceHover text-gray-400 hover:text-white border border-gray-700 rounded text-[11px]" title="Open Tab"><i class="fa-solid fa-arrow-up-right-from-square"></i></a>
                            <button onclick="removeFileRow(this)" class="p-1 text-red-400/70 hover:text-red-400 transition" title="Delete"><i class="fa-solid fa-trash-can text-xs"></i></button>
                        </div>
                    </div>
                    <input type="text" class="file-name-input bg-surface text-gray-200 text-xs font-medium px-2 py-1 rounded border border-gray-800 focus:outline-none focus:border-cyanAccent" placeholder="Dashboard / File Name" value="${escapeHtml(file.name)}" oninput="triggerAutoSave()">
                    <input type="text" class="file-url-input bg-surface text-gray-300 text-[11px] font-mono px-2 py-1 rounded border border-gray-800 focus:outline-none focus:border-cyanAccent" placeholder="Paste URL or Embed Link here..." value="${escapeHtml(file.url)}" oninput="triggerAutoSave()">
                `;
                container.appendChild(row);
            });
            refreshRowNumbers();
        }

        function refreshRowNumbers() {
            document.querySelectorAll('#file-list-container .file-row').forEach((row, idx) => {
                row.querySelector('.file-number').innerText = `#${idx + 1}`;
                row.querySelector('.view-btn').setAttribute('onclick', `selectAndDisplay(${idx})`);
            });
            updatePageIndicator();
        }

        function updatePageIndicator() {
            const rows = document.querySelectorAll('#file-list-container .file-row'), indicator = document.getElementById('page-indicator');
            if (rows.length === 0) { indicator.innerText = `0 / 0`; currentActiveIndex = 0; } 
            else {
                if (currentActiveIndex >= rows.length) currentActiveIndex = rows.length - 1;
                indicator.innerText = `${currentActiveIndex + 1} / ${rows.length}`;
            }
        }

        function selectAndDisplay(index) {
            const rows = document.querySelectorAll('#file-list-container .file-row');
            if (rows.length === 0) { updatePageIndicator(); return; }
            if (index < 0) index = rows.length - 1;
            if (index >= rows.length) index = 0;

            currentActiveIndex = index;
            localStorage.setItem(ACTIVE_INDEX_KEY, currentActiveIndex);
            
            rows.forEach((r, idx) => {
                if (idx === index) r.classList.add('border-cyanAccent/80', 'shadow-lg', 'shadow-cyan-500/10');
                else r.classList.remove('border-cyanAccent/80', 'shadow-lg', 'shadow-cyan-500/10');
            });

            displayEmbed(index);
            updatePageIndicator();
        }

        function displayEmbed(index) {
            const rows = document.querySelectorAll('#file-list-container .file-row');
            if (!rows[index]) return;

            const name = rows[index].querySelector('.file-name-input').value.trim();
            const url = rows[index].querySelector('.file-url-input').value.trim();
            const loader = document.getElementById('iframe-loader');

            document.getElementById('active-dashboard-title').innerText = name || 'Untitled Dashboard';
            document.getElementById('external-open-btn').href = url || '#';
            loader.style.display = 'flex';
            loader.classList.remove('opacity-0', 'pointer-events-none');

            document.getElementById('ppt-iframe').src = url ? url : 'about:blank';
            if (!url) setTimeout(onIframeLoaded, 300);
        }

        function nextFile() {
            const rows = document.querySelectorAll('#file-list-container .file-row');
            if (rows.length > 0) selectAndDisplay((currentActiveIndex + 1) % rows.length);
        }

        function prevFile() {
            const rows = document.querySelectorAll('#file-list-container .file-row');
            if (rows.length > 0) selectAndDisplay((currentActiveIndex - 1 + rows.length) % rows.length);
        }

        function addFileRow() {
            const container = document.getElementById('file-list-container'), newIndex = container.querySelectorAll('.file-row').length;
            const row = document.createElement('div');
            row.className = 'file-row flex flex-col gap-1.5 bg-darkbg border border-gray-800 rounded-xl p-2.5 transition focus-within:border-cyanAccent';
            row.innerHTML = `
                <div class="flex items-center justify-between gap-1">
                    <span class="file-number text-cyanAccent font-extrabold text-xs font-mono">#${newIndex + 1}</span>
                    <select class="file-type-select bg-surface text-gray-300 text-[11px] font-semibold rounded px-1.5 py-0.5 border border-gray-700 focus:outline-none" onchange="triggerAutoSave()">
                        <option value="embed" selected>Embed View</option>
                        <option value="external">External Link</option>
                    </select>
                    <div class="flex items-center gap-1">
                        <button onclick="selectAndDisplay(${newIndex})" class="view-btn px-2 py-0.5 bg-cyan-600/20 hover:bg-cyan-600/40 text-cyanAccent border border-cyan-500/40 rounded text-[11px] font-semibold transition" title="Display">View</button>
                        <a href="#" target="_blank" class="ext-btn px-1.5 py-0.5 bg-surface hover:bg-surfaceHover text-gray-400 hover:text-white border border-gray-700 rounded text-[11px]" title="Open Tab"><i class="fa-solid fa-arrow-up-right-from-square"></i></a>
                        <button onclick="removeFileRow(this)" class="p-1 text-red-400/70 hover:text-red-400 transition" title="Delete"><i class="fa-solid fa-trash-can text-xs"></i></button>
                    </div>
                </div>
                <input type="text" class="file-name-input bg-surface text-gray-200 text-xs font-medium px-2 py-1 rounded border border-gray-800 focus:outline-none focus:border-cyanAccent" placeholder="Dashboard / File Name" oninput="triggerAutoSave()">
                <input type="text" class="file-url-input bg-surface text-gray-300 text-[11px] font-mono px-2 py-1 rounded border border-gray-800 focus:outline-none focus:border-cyanAccent" placeholder="Paste URL or Embed Link here..." oninput="triggerAutoSave()">
            `;
            container.appendChild(row);
            refreshRowNumbers();
            triggerAutoSave();
        }

        function removeFileRow(btn) {
            const row = btn.closest('.file-row'), container = document.getElementById('file-list-container');
            const removedIndex = Array.from(container.querySelectorAll('.file-row')).indexOf(row);
            row.remove();
            refreshRowNumbers();

            const remainingRows = container.querySelectorAll('.file-row');
            if (remainingRows.length > 0) {
                if (currentActiveIndex >= remainingRows.length) selectAndDisplay(remainingRows.length - 1);
                else if (removedIndex === currentActiveIndex) selectAndDisplay(Math.min(removedIndex, remainingRows.length - 1));
                else selectAndDisplay(currentActiveIndex);
            } else {
                currentActiveIndex = 0;
                document.getElementById('ppt-iframe').src = 'about:blank';
                setTimeout(onIframeLoaded, 300);
                saveFilesToStorage();
                updatePageIndicator();
            }
        }

        function triggerAutoSave() {
            showSaveStatus('Typing...');
            clearTimeout(saveDebounceTimer);
            saveDebounceTimer = setTimeout(saveFilesToStorage, 800);
        }

        function saveFilesToStorage() {
            let fileList = [];
            document.getElementById('file-list-container').querySelectorAll('.file-row').forEach(row => {
                const name = row.querySelector('.file-name-input').value, url = row.querySelector('.file-url-input').value, type = row.querySelector('.file-type-select').value;
                const extBtn = row.querySelector('.ext-btn');
                if (extBtn) extBtn.href = url || '#';
                fileList.push({ name, url, type });
            });
            localStorage.setItem(FILES_KEY, JSON.stringify(fileList));
            localStorage.setItem(ACTIVE_INDEX_KEY, currentActiveIndex);
            showSaveStatus('Saved');
        }

        function exportHTMLFile() {
            let currentList = [];
            document.querySelectorAll('#file-list-container .file-row').forEach(row => {
                currentList.push({
                    name: row.querySelector('.file-name-input').value,
                    url: row.querySelector('.file-url-input').value,
                    type: row.querySelector('.file-type-select').value
                });
            });

            let fullHtml = document.documentElement.outerHTML;
            fullHtml = fullHtml.replace(/fileList = \[\s*\{[\s\S]*?\}\s*\];/g, `fileList = ${JSON.stringify(currentList, null, 4)};`);

            const blob = new Blob([fullHtml], { type: 'text/html' }), a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'SE_Command_Center_Dashboard.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(a.href);
            showSaveStatus('Exported HTML!');
        }

        function showSaveStatus(msg) {
            const statusEl = document.getElementById('save-status');
            statusEl.innerText = msg;
            statusEl.classList.remove('opacity-0');
            setTimeout(() => statusEl.classList.add('opacity-0'), 2500);
        }

        function handleRefreshChange(value) {
            if (autoRefreshTimer) { clearInterval(autoRefreshTimer); autoRefreshTimer = null; }
            if (value !== 'off') autoRefreshTimer = setInterval(reloadViewer, parseInt(value, 10) * 60 * 1000);
        }

        function toggleTVMode() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(err => alert(`Error: ${err.message}`));
            else if (document.exitFullscreen) document.exitFullscreen();
        }

        function escapeHtml(str) {
            return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;") : '';
        }

        window.addEventListener('DOMContentLoaded', loadFiles);
    </script>
